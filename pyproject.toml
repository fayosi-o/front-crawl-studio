[project]
name = "long-catch"
version = "0.3.0"
description = "Silent, local 3D teaching model of front-crawl stroke shape."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["nicegui>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
